[package]
name = "logiclab-core"
version = "0.1.0"
edition = "2021"
description = "LogicLab circuit netlist + discrete-event simulation core (pure Rust, no engine deps)"

[lib]
name = "logiclab_core"

# core 只依赖基础库（v3 §3.2）：绝不引入任何引擎类型（ADR-21）
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
